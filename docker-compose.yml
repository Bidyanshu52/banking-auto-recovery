services:
  banking-api:
    build: .
    container_name: banking-api
    ports:
      - "5000:5000"
    restart: unless-stopped
    environment:
      APP_VERSION: "1.0"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 3
